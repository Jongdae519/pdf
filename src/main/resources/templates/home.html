<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:hx-on="http://www.w3.org/1999/xhtml" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF 병합 도구</title>
    <link th:each="css : ${@viteAssetsResolver.getViteCss()}" th:href="@{${css}}" rel="stylesheet">
    <script th:src="${@viteAssetsResolver.getViteJs()}"></script>
</head>
<body class="bg-gray-50 font-sans text-gray-800 min-h-screen flex items-center justify-center p-4">

<main class="w-full max-w-lg bg-white rounded-2xl shadow-xl overflow-hidden border border-gray-100">

    <header class="bg-indigo-600 p-6 text-center">
        <div class="flex justify-center mb-3">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-white" fill="none" viewBox="0 0 24 24"
                 stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round"
                      d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z"/>
            </svg>
        </div>
        <h1 class="text-2xl font-bold text-white tracking-tight">PDF 파일 병합</h1>
        <p class="text-indigo-200 text-sm mt-1">여러 개의 PDF를 하나의 파일로 합쳐줍니다.</p>
    </header>

    <div id="form-container" class="p-6 md:p-8">
        <form id="pdf-merge-form" class="space-y-6"
              action="/pdf/merge"
              method="POST"
              enctype="multipart/form-data">

            <div class="relative border-2 border-dashed border-gray-300 rounded-xl p-8 text-center hover:border-indigo-500 hover:bg-indigo-50 transition-colors group">
                <input type="file" name="pdfFiles" multiple accept=".pdf" required
                       hx-on:change="
                         const root = document.getElementById('file-list-tmpl').content.cloneNode(true);
                         root.querySelector('[data-count]').textContent = `선택된 파일 ${this.files.length}개`;
                         const ul = root.querySelector('[data-list]');
                         const itm = document.getElementById('file-item-tmpl');
                         for (const f of this.files) {
                           const node = itm.content.cloneNode(true);
                           node.querySelector('[data-name]').textContent = f.name;
                           node.querySelector('[data-size]').textContent = (f.size / 1024).toFixed(1) + ' KB';
                           ul.appendChild(node);
                         }
                         document.getElementById('file-list').replaceChildren(root);
                       "
                       class="absolute inset-0 w-full h-full opacity-0 cursor-pointer"/>
                <div class="space-y-2 pointer-events-none">
                    <svg xmlns="http://www.w3.org/2000/svg"
                         class="mx-auto h-10 w-10 text-gray-400 group-hover:text-indigo-500 transition-colors"
                         fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round"
                              d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/>
                    </svg>
                    <p class="text-sm font-medium text-gray-700">클릭하거나 파일을 이곳으로 드래그하세요</p>
                    <p class="text-xs text-gray-500">여러 개의 PDF 파일 지원 (개수 제한 없음)</p>
                </div>
            </div>

            <div id="file-list"></div>

            <button type="submit"
                    class="w-full flex items-center justify-center py-3 px-4 border border-transparent rounded-xl shadow-sm text-sm font-bold text-white bg-indigo-600 hover:bg-indigo-700 transition-colors">
                    <span class="flex items-center">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" fill="none" viewBox="0 0 24 24"
                             stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                  d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"/>
                        </svg>
                        병합 시작하기
                    </span>
            </button>
        </form>
    </div>

    <div class="bg-gray-50 px-6 py-4 border-t border-gray-100 text-center">
        <p class="text-xs text-gray-500">
            업로드 및 병합 작업은 메모리에서 즉시 처리되며 서버에 저장되지 않습니다.
        </p>
    </div>
</main>

<template id="file-list-tmpl">
    <p class="text-xs font-semibold text-gray-600 mb-2" data-count></p>
    <ul class="space-y-2" data-list></ul>
</template>

<template id="file-item-tmpl">
    <li class="flex items-center justify-between px-3 py-2 bg-gray-50 rounded-lg border border-gray-200">
        <div class="flex items-center gap-2 min-w-0">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-indigo-500 shrink-0"
                 fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round"
                      d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z"/>
            </svg>
            <span class="text-sm text-gray-800 truncate" data-name></span>
        </div>
        <span class="text-xs text-gray-500 shrink-0 ml-2" data-size></span>
    </li>
</template>

</body>
</html>
